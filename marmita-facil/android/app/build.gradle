plugins { id 'com.android.application' }

android {
    namespace 'br.com.marmitafacil.app'
    compileSdk 35
    buildToolsVersion '35.0.0'
    defaultConfig {
        applicationId 'br.com.marmitafacil.app'
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    def keyFile = rootProject.file('signing/credentials.json')
    if (keyFile.exists()) {
        def key = new groovy.json.JsonSlurper().parse(keyFile)
        signingConfigs {
            release {
                storeFile rootProject.file('signing/marmita-facil.p12')
                storePassword key.password
                keyAlias key.alias
                keyPassword key.password
            }
        }
        buildTypes.release.signingConfig = signingConfigs.release
    }
    buildTypes {
        release { minifyEnabled false }
        debug { applicationIdSuffix '.dev' }
    }
}
